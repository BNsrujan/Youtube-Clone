<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="980" height="700" fill="#ffffff"/>

  <text x="30" y="40" font-size="21" font-weight="700" fill="#0f172a">Video streaming — upload to playback</text>
  <text x="30" y="62" font-size="13" fill="#64748b">HLS adaptive bitrate. The server publishes options; the player chooses.</text>

  <!-- ============ PHASE 1: INGEST ============ -->
  <rect x="30" y="86" width="920" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="46" y="108" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.8">1 · INGEST &amp; TRANSCODE  (async — creator does not wait)</text>

  <rect x="50" y="122" width="120" height="54" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="110" y="144" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Creator</text>
  <text x="110" y="161" font-size="10.5" fill="#64748b" text-anchor="middle">POST /videos</text>

  <rect x="205" y="122" width="130" height="54" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="270" y="139" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">multer</text>
  <text x="270" y="155" font-size="10" fill="#64748b" text-anchor="middle">random filename</text>
  <text x="270" y="168" font-size="10" fill="#64748b" text-anchor="middle">mime + 500MB cap</text>

  <rect x="370" y="122" width="150" height="54" rx="6" fill="#ecfdf5" stroke="#5eead4"/>
  <text x="445" y="139" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Transcoder</text>
  <text x="445" y="155" font-size="10" fill="#0f766e" text-anchor="middle">5 renditions</text>
  <text x="445" y="168" font-size="10" fill="#0f766e" text-anchor="middle">6-second segments</text>

  <rect x="555" y="122" width="130" height="54" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="620" y="144" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Storage + CDN</text>
  <text x="620" y="161" font-size="10" fill="#64748b" text-anchor="middle">.m3u8 + .ts</text>

  <rect x="720" y="122" width="210" height="54" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="825" y="139" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">MongoDB · Video</text>
  <text x="825" y="155" font-size="10" fill="#64748b" text-anchor="middle">transcodeStatus: processing → ready</text>
  <text x="825" y="168" font-size="10" fill="#94a3b8" text-anchor="middle">gates the video out of all feeds</text>

  <line x1="170" y1="149" x2="200" y2="149" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="335" y1="149" x2="365" y2="149" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="520" y1="149" x2="550" y2="149" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="685" y1="149" x2="715" y2="149" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <text x="447" y="196" font-size="10" fill="#94a3b8" text-anchor="middle">201 Created returns here — transcode finishes later, webhook flips status</text>
  <path d="M 445 205 Q 445 222 300 222 Q 130 222 130 186" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <!-- ============ PHASE 2: LADDER ============ -->
  <rect x="30" y="252" width="440" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="46" y="274" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.8">2 · THE RENDITION LADDER</text>

  <rect x="50" y="286" width="400" height="26" rx="4" fill="#0f766e"/>
  <text x="62" y="304" font-size="11" font-weight="600" fill="#ffffff">1080p</text>
  <text x="150" y="304" font-size="11" fill="#ccfbf1">5.0 Mbps</text>
  <text x="250" y="304" font-size="10.5" fill="#99f6e4">desktop, strong connection</text>

  <rect x="50" y="316" width="340" height="26" rx="4" fill="#14b8a6"/>
  <text x="62" y="334" font-size="11" font-weight="600" fill="#ffffff">720p</text>
  <text x="150" y="334" font-size="11" fill="#ffffff">2.8 Mbps</text>
  <text x="250" y="334" font-size="10.5" fill="#f0fdfa">most sessions</text>

  <rect x="50" y="346" width="250" height="26" rx="4" fill="#5eead4"/>
  <text x="62" y="364" font-size="11" font-weight="600" fill="#0f172a">480p</text>
  <text x="150" y="364" font-size="11" fill="#0f172a">1.4 Mbps</text>
  <text x="250" y="364" font-size="10.5" fill="#134e4a">mobile</text>

  <rect x="50" y="376" width="170" height="26" rx="4" fill="#99f6e4"/>
  <text x="62" y="394" font-size="11" font-weight="600" fill="#0f172a">360p</text>
  <text x="150" y="394" font-size="11" fill="#0f172a">0.8 Mbps</text>

  <rect x="50" y="406" width="110" height="26" rx="4" fill="#ccfbf1"/>
  <text x="62" y="424" font-size="11" font-weight="600" fill="#0f172a">240p</text>

  <text x="46" y="446" font-size="10" fill="#64748b">Each rung ≈ half the bitrate above. Closer spacing makes the player oscillate.</text>

  <!-- ============ PHASE 3: PLAYBACK ============ -->
  <rect x="490" y="252" width="460" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="506" y="274" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.8">3 · ADAPTIVE PLAYBACK  (client-driven)</text>

  <text x="506" y="296" font-size="10.5" fill="#64748b">Player measures throughput per segment and switches rung mid-stream:</text>

  <line x1="520" y1="392" x2="920" y2="392" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="520" y1="316" x2="520" y2="392" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="512" y="320" font-size="9" fill="#94a3b8" text-anchor="end">high</text>
  <text x="512" y="390" font-size="9" fill="#94a3b8" text-anchor="end">low</text>

  <polyline points="530,370 590,370 590,326 660,326 660,352 730,352 730,340 800,340 800,326 900,326"
            fill="none" stroke="#0d9488" stroke-width="2.4"/>
  <circle cx="530" cy="370" r="3.5" fill="#0d9488"/>
  <circle cx="590" cy="326" r="3.5" fill="#0d9488"/>
  <circle cx="660" cy="352" r="3.5" fill="#0d9488"/>
  <circle cx="730" cy="340" r="3.5" fill="#0d9488"/>
  <circle cx="800" cy="326" r="3.5" fill="#0d9488"/>

  <text x="530" y="386" font-size="9" fill="#64748b" text-anchor="middle">480p</text>
  <text x="590" y="318" font-size="9" fill="#0f766e" text-anchor="middle">1080p</text>
  <text x="662" y="368" font-size="9" fill="#64748b" text-anchor="middle">720p</text>
  <text x="800" y="318" font-size="9" fill="#0f766e" text-anchor="middle">1080p</text>

  <text x="530" y="408" font-size="9" fill="#94a3b8">seg 0</text>
  <text x="596" y="408" font-size="9" fill="#94a3b8">seg 1</text>
  <text x="666" y="408" font-size="9" fill="#94a3b8">seg 2</text>
  <text x="736" y="408" font-size="9" fill="#94a3b8">seg 3</text>
  <text x="806" y="408" font-size="9" fill="#94a3b8">seg 4</text>

  <text x="600" y="428" font-size="9.5" fill="#64748b">start safe</text>
  <text x="660" y="428" font-size="9.5" fill="#dc2626">↓ congestion</text>
  <text x="790" y="428" font-size="9.5" fill="#0f766e">↑ recovered</text>

  <text x="506" y="446" font-size="10" fill="#64748b">Segments come straight from the CDN — the API is not in the media path.</text>

  <!-- ============ PHASE 4: HEARTBEAT ============ -->
  <rect x="30" y="468" width="920" height="196" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="46" y="490" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.8">4 · PROGRESS HEARTBEAT  —  every ~10s, one endpoint, three jobs</text>

  <rect x="50" y="504" width="150" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="125" y="526" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Player</text>
  <text x="125" y="543" font-size="10" fill="#64748b" text-anchor="middle">POST /progress</text>
  <text x="125" y="556" font-size="9.5" fill="#94a3b8" text-anchor="middle">sendBeacon on unload</text>

  <rect x="240" y="504" width="180" height="60" rx="6" fill="#ecfdf5" stroke="#5eead4"/>
  <text x="330" y="524" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">WatchEvent (upsert)</text>
  <text x="330" y="540" font-size="9.5" fill="#0f766e" text-anchor="middle">one row per (user, video)</text>
  <text x="330" y="553" font-size="9.5" fill="#0f766e" text-anchor="middle">watchSeconds only increases</text>

  <line x1="200" y1="534" x2="235" y2="534" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arAccent)"/>

  <rect x="470" y="486" width="220" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="580" y="506" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">Resume point</text>
  <text x="580" y="522" font-size="9.5" fill="#64748b" text-anchor="middle">lastPositionSeconds → continue watching</text>

  <rect x="470" y="546" width="220" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="580" y="566" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">View counted</text>
  <text x="580" y="582" font-size="9.5" fill="#64748b" text-anchor="middle">once, at watchRatio ≥ 0.30</text>

  <rect x="470" y="606" width="220" height="52" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="580" y="626" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">Recommendation signal</text>
  <text x="580" y="642" font-size="9.5" fill="#92400e" text-anchor="middle">watchRatio → taste profile</text>

  <path d="M 420 528 Q 445 528 445 512 L 465 512" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="420" y1="537" x2="465" y2="572" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 420 550 Q 445 550 445 632 L 465 632" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="730" y="546" width="200" height="112" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="830" y="568" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Why the 30% threshold</text>
  <text x="746" y="588" font-size="10" fill="#475569">A view is not a page load.</text>
  <text x="746" y="604" font-size="10" fill="#475569">Views feed trending, trending</text>
  <text x="746" y="618" font-size="10" fill="#475569">feeds candidates, candidates</text>
  <text x="746" y="632" font-size="10" fill="#475569">feed everyone's home page.</text>
  <text x="746" y="650" font-size="10" fill="#0f766e" font-weight="600">Inflate views → inflate the feed.</text>

  <text x="746" y="518" font-size="10" fill="#475569" font-style="italic">Server clamps every value —</text>
  <text x="746" y="532" font-size="10" fill="#475569" font-style="italic">clients can send anything.</text>
</svg>
